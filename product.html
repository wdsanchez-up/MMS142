
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spring | Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">

        <nav class="navbar navbar-expand-lg">

            <div class="container">

                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/spring-logo.png" alt="Spring logo">
                    Spring
                </a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="mainNavigation">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="shop.html"
                                aria-current="page">Shop</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <main>

        <section class="product-details">

            <div class="container">

                <div class="row g-5 align-items-start">

                    <div class="col-md-6">

                        <div class="product-gallery">

                            <img src="assets/images/dont-be-late-main.jpg"
                                alt="Selected Spring product"
                                class="product-main-image"
                                data-product-image>

                            <div class="product-gallery-thumbnails"
                                data-product-gallery>

                                <img src="assets/images/dont-be-late-front.jpg"
                                    alt="Product front view">

                                <img src="assets/images/dont-be-late-back.jpg"
                                    alt="Product back view">

                                <img src="assets/images/dont-be-late-detail.jpg"
                                    alt="Product detail view">

                                <img src="assets/images/dont-be-late-colors.jpg"
                                    alt="Available product colors">

                            </div>

                        </div>

                    </div>


                    <div class="col-md-6">

                        <div class="product-information">

                            <h1 data-product-name>Product Name</h1>

                            <p class="product-price" data-product-price>
                                ₱499
                            </p>

                            <p class="product-description" data-product-description>
                                A simple reminder to show up, get moving,
                                and make the most of the day.
                            </p>


                            <form class="product-selection-form"
                                data-product-form>

                                <input type="hidden"
                                    name="productId"
                                    data-product-id>

                                <div class="mb-3">

                                    <label for="product-color" class="form-label">
                                        Color
                                    </label>

                                    <select class="form-select"
                                        id="product-color"
                                        name="color"
                                        required>

                                        <option value="" selected disabled>
                                            Choose a color
                                        </option>

                                        <option value="White">White</option>
                                        <option value="Black">Black</option>
                                        <option value="Beige">Beige</option>

                                    </select>

                                </div>


                                <div class="mb-3">

                                    <label for="product-size" class="form-label">
                                        Size
                                    </label>

                                    <select class="form-select"
                                        id="product-size"
                                        name="size"
                                        required>

                                        <option value="" selected disabled>
                                            Choose a size
                                        </option>

                                        <option value="S">S</option>
                                        <option value="M">M</option>
                                        <option value="L">L</option>
                                        <option value="XL">XL</option>
                                        <option value="XXL">XXL</option>

                                    </select>

                                </div>


                                <div class="mb-4">

                                    <label for="product-quantity" class="form-label">
                                        Quantity
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        id="product-quantity"
                                        name="quantity"
                                        value="1"
                                        min="1"
                                        step="1"
                                        required>

                                </div>


                                <button type="submit"
                                    class="btn product-button"
                                    id="add-to-cart">

                                    Add to Cart

                                </button>

                                <p data-cart-feedback aria-live="polite"></p>

                            </form>

                            <a href="cart.html" class="btn">
                                View Cart
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <section class="product-description-section">

            <div class="container">

                <h2>Product Details</h2>

                <p data-product-details>
                    A comfortable everyday tee designed for simple,
                    effortless styling.
                </p>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <a href="index.html" class="footer-brand">
                        <img src="assets/images/spring-logo.png" alt="">
                        Spring
                    </a>

                </div>

                <div class="col-md-6 text-md-end">

                    <p>
                        © 2026 ·
                        <a href="privacy-policy.html">Privacy</a>
                        ·
                        <a href="terms.html">Terms</a>
                    </p>

                </div>

            </div>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

</body>

</html>
