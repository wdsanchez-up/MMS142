
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spring | Delivery Address</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">

        <nav class="navbar navbar-expand-lg">

            <div class="container">

                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/spring-logo.png" alt="Spring logo">
                    Spring
                </a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="mainNavigation">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="shop.html">Shop</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <main>

        <section class="delivery-section">

            <div class="container">

                <h1>Delivery Address</h1>

                <p>
                    Please provide your information for delivery.
                </p>


                <form id="delivery-address-form"
                    data-delivery-form
                    action="order-form.html"
                    method="post">


                    <div class="mb-3">

                        <label for="country" class="form-label">
                            Country
                        </label>

                        <select class="form-select"
                            id="country"
                            name="country"
                            required>

                            <option value="Philippines" selected>
                                Philippines
                            </option>

                        </select>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="firstName" class="form-label">
                                First Name
                            </label>

                            <input type="text"
                                class="form-control"
                                id="firstName"
                                name="firstName"
                                autocomplete="given-name"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="lastName" class="form-label">
                                Last Name
                            </label>

                            <input type="text"
                                class="form-control"
                                id="lastName"
                                name="lastName"
                                autocomplete="family-name"
                                required>

                        </div>

                    </div>


                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="phone" class="form-label">
                            Phone Number
                        </label>

                        <input type="tel"
                            class="form-control"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="address" class="form-label">
                            Street Address
                        </label>

                        <input type="text"
                            class="form-control"
                            id="address"
                            name="address"
                            autocomplete="street-address"
                            required>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="city" class="form-label">
                                City
                            </label>

                            <input type="text"
                                class="form-control"
                                id="city"
                                name="city"
                                autocomplete="address-level2"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="region" class="form-label">
                                Province / Region
                            </label>

                            <input type="text"
                                class="form-control"
                                id="region"
                                name="region"
                                autocomplete="address-level1"
                                required>

                        </div>

                    </div>


                    <div class="mb-4">

                        <label for="postalCode" class="form-label">
                            Postal Code
                        </label>

                        <input type="text"
                            class="form-control"
                            id="postalCode"
                            name="postalCode"
                            autocomplete="postal-code"
                            required>

                    </div>


                    <button type="submit"
                        class="btn product-button">

                        Continue to Order Review

                    </button>

                    <p data-delivery-feedback aria-live="polite"></p>

                </form>


                <a href="cart.html" class="btn">
                    Back to Cart
                </a>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <a href="index.html" class="footer-brand">
                        <img src="assets/images/spring-logo.png" alt="">
                        Spring
                    </a>

                </div>

                <div class="col-md-6 text-md-end">

                    <p>
                        © 2026 ·
                        <a href="privacy-policy.html">Privacy</a>
                        ·
                        <a href="terms.html">Terms</a>
                    </p>

                </div>

            </div>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/order-now.js"></script>

</body>

</html>
